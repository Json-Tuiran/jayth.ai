# Compila Jayth para Windows, macOS y Linux y publica una Release en GitHub.
# Se ejecuta al subir una etiqueta de version (git tag v0.2.0 && git push origin v0.2.0)
# o a mano desde la pestaña Actions (en ese caso solo deja los paquetes como artefactos).
name: Compilar y publicar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-14, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: ubuntu-22.04, name: linux-x86_64 }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Comprobar la version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V=$(python -c "import jayth; print(jayth.__version__)")
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "La etiqueta ${GITHUB_REF_NAME} no coincide con __version__ = $V"; exit 1; }

      - name: Bibliotecas de Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libegl1 libfontconfig1 libdbus-1-3 file

      - name: Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Compilar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/build.ps1

      - name: Compilar (macOS)
        if: runner.os == 'macOS'
        run: bash packaging/macos/build_dmg.sh

      - name: Compilar (Linux)
        if: runner.os == 'Linux'
        run: bash packaging/linux/build_appimage.sh

      - uses: actions/upload-artifact@v5
        with:
          name: jayth-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.gz

  release:
    name: Publicar la Release
    needs: build
    # se publica lo que se haya compilado aunque falle alguna plataforma
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true

      - name: Crear la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh out
          cat > notes.md <<'EOF'
          ## Descargas

          | Sistema | Archivo |
          |---|---|
          | Windows 10/11 (64 bits) | `Jayth-Setup-…-x64.exe` (instalador) o `…-windows-x64-portable.zip` |
          | macOS Apple Silicon (M1–M4) | `…-macos-arm64.dmg` |
          | macOS Intel | `…-macos-x64.dmg` |
          | Linux (x86_64) | `…-linux-x86_64.AppImage` o `.tar.gz` |

          No hace falta instalar Python ni nada más. Al abrir Jayth por primera vez, el asistente descarga el motor (llama.cpp) y el modelo.

          Los paquetes no están firmados todavía:
          - **Windows:** si aparece «Windows protegió su PC», pulsa *Más información → Ejecutar de todas formas*.
          - **macOS:** la primera vez, clic derecho sobre Jayth → *Abrir*; o en *Ajustes del Sistema → Privacidad y seguridad → Abrir igualmente*.
          - **Linux:** `chmod +x Jayth-*.AppImage` y ábrelo.
          EOF
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "Jayth ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md --generate-notes
