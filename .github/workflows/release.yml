# Compila Jayth para Windows, macOS y Linux y publica una Release en GitHub.
# Se ejecuta al subir una etiqueta de version (git tag v0.2.0 && git push origin v0.2.0)
# o a mano desde la pestaña Actions (en ese caso solo deja los paquetes como artefactos).
name: Compilar y publicar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read             # SignPath lee el paquete sin firmar de los artefactos de esta ejecución

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      # firma de Windows con SignPath: se activa sola al configurar el secreto SIGNPATH_API_TOKEN y la variable
      # SIGNPATH_ORGANIZATION_ID del repositorio (ver packaging/FIRMA.md); sin ellos, los paquetes salen sin firmar
      SIGNPATH_ON: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-15, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: ubuntu-22.04, name: linux-x86_64 }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Comprobar la version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V=$(python -c "import jayth; print(jayth.__version__)")
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "La etiqueta ${GITHUB_REF_NAME} no coincide con __version__ = $V"; exit 1; }

      # idiomas y guía del agente al día: ningún texto sin traducir y la guía nombra todos los ajustes y menús
      - name: Comprobar traducciones y guía de Jayth
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tools_i18n/catalogo.py revisar
          python tools_i18n/revisar_guia.py

      - name: Bibliotecas de Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libegl1 libfontconfig1 libdbus-1-3 file \
            libnss3 libnspr4 libasound2 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libxshmfence1 libgbm1 \
            libpulse0 libpulse-mainloop-glib0 libspeechd2

      - name: Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # protecciones del agente (acciones peligrosas, datos privados, inyección de instrucciones…): ver SECURITY.md
      - name: Pruebas de seguridad
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v

      - name: Compilar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/build.ps1

      - name: Compilar (macOS)
        if: runner.os == 'macOS'
        run: bash packaging/macos/build_dmg.sh

      - name: Compilar (Linux)
        if: runner.os == 'Linux'
        run: bash packaging/linux/build_appimage.sh

      # ---- firma de Windows (SignPath): se sube el paquete sin firmar, SignPath lo firma (tras aprobarlo el responsable)
      #      y se sustituye en dist/ por el firmado
      - name: Paquete sin firmar (Windows)
        id: sin_firmar
        if: runner.os == 'Windows' && env.SIGNPATH_ON == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: jayth-windows-x64-sin-firmar
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip

      - name: Firmar con SignPath (Windows)
        if: runner.os == 'Windows' && env.SIGNPATH_ON == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'jayth' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'initial' }}
          github-artifact-id: ${{ steps.sin_firmar.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist-firmado

      - name: Usar los paquetes firmados (Windows)
        if: runner.os == 'Windows' && env.SIGNPATH_ON == 'true'
        shell: pwsh
        run: |
          Copy-Item dist-firmado\* dist\ -Force
          Get-AuthenticodeSignature dist\*.exe | Format-Table Status, SignerCertificate, Path -AutoSize

      # ---- actualizaciones que solo descargan lo que cambia (jayth/parches.py; ver packaging/ACTUALIZACIONES.md):
      #      la huella de cada archivo de esta versión («manifiesto») y un paquete de cambios desde cada una de las
      #      últimas versiones que publicaron la suya. Con la firma de SignPath activa no se generan: los archivos
      #      instalados (firmados) ya no serían los de dist\Jayth; las actualizaciones siguen con el instalador completo.
      - name: Manifiesto y paquetes de cambios (Windows)
        if: runner.os == 'Windows' && env.SIGNPATH_ON != 'true' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: utf-8
        run: |
          V="${GITHUB_REF_NAME#v}"
          python -m jayth.parches manifiesto dist/Jayth --version "$V" --plataforma windows-x64 -o "dist/Jayth-$V-windows-x64.manifest.json"
          n=0
          for T in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 12 --exclude-drafts --exclude-pre-releases --json tagName -q '.[].tagName'); do
            P="${T#v}"
            if [ "$P" = "$V" ]; then continue; fi
            rm -rf prev && mkdir prev
            if gh release download "$T" --repo "$GITHUB_REPOSITORY" -p "Jayth-$P-windows-x64.manifest.json" -D prev 2>/dev/null; then
              python -m jayth.parches parche dist/Jayth --nuevo "dist/Jayth-$V-windows-x64.manifest.json" \
                --anterior "prev/Jayth-$P-windows-x64.manifest.json" -o "dist/Jayth-parche-$P-a-$V-windows-x64.zip" \
                || echo "::warning title=Paquete de cambios::no se pudo crear desde la $P (esa versión usará el instalador completo)"
              n=$((n+1))
              if [ "$n" -ge 3 ]; then break; fi
            fi
          done
          ls -lh dist | grep -i "manifest\|parche" || true

      - uses: actions/upload-artifact@v6
        with:
          name: jayth-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.manifest.json

  release:
    name: Publicar la Release
    needs: build
    # se publica lo que se haya compilado aunque falle alguna plataforma
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true

      - name: Crear la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh out
          # huellas SHA-256 de cada descarga, para comprobarla (Get-FileHash en Windows, sha256sum en Linux y macOS)
          (cd out && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # idempotente: si la Release ya existe (p. ej. al repetir una plataforma que fallo) se suben o reemplazan los archivos
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "Jayth ${GITHUB_REF_NAME#v}" \
              --notes "Jayth ${GITHUB_REF_NAME#v}"
          fi

      # descarga directa por sistema: copias sin número de versión (enlaces fijos a la última) y notas con un enlace por sistema
      - name: Enlaces de descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/enlaces_release.sh "$GITHUB_REF_NAME" out

  # winget («winget install JeisonTuiran.Jayth»): al publicar una versión se abre sola la petición que actualiza la ficha
  # en microsoft/winget-pkgs. Se activa al configurar el secreto WINGET_TOKEN (ver packaging/WINGET.md); la primera
  # versión de la ficha se envía a mano. Si falla, la Release ya está publicada y no se marca como error.
  winget:
    name: Actualizar winget
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      WINGET_ON: ${{ secrets.WINGET_TOKEN != '' }}
    steps:
      - name: Enviar la versión a winget-pkgs
        if: env.WINGET_ON == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: JeisonTuiran.Jayth
          installers-regex: 'Jayth-Setup-[0-9.]+-x64\.exe$'
          release-tag: ${{ github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}
